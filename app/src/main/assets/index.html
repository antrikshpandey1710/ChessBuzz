<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ChessBuzz</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">♟ ChessBuzz</div>
        <div class="subtitle">Play Chess</div>
    </header>


    <main>

        <section id="menu" class="menu">

            <h1>Choose Difficulty</h1>

            <button class="difficulty easy"
                    onclick="startGame('easy')">
                🟢 Easy
            </button>

            <button class="difficulty medium"
                    onclick="startGame('medium')">
                🟡 Medium
            </button>

            <button class="difficulty hard"
                    onclick="startGame('hard')">
                🔴 Hard
            </button>

            <button class="difficulty advanced"
                    onclick="startGame('advanced')">
                ⚫ Advanced
            </button>

        </section>


        <section id="game" class="game">

            <div class="topbar">

                <button onclick="backToMenu()">
                    ← Menu
                </button>

                <span id="difficultyText">
                    Easy
                </span>

                <button onclick="restartGame()">
                    ↻
                </button>

            </div>


            <div id="status">
                Your turn
            </div>


            <div id="board"></div>


            <div class="game-buttons">

                <button onclick="undoMove()">
                    Undo
                </button>

                <button onclick="restartGame()">
                    New Game
                </button>

            </div>


            <div id="message"></div>

        </section>

    </main>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="app.js"></script>

</body>

</html>
