plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chessbuzz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chessbuzz.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
}

tasks.register("copyWebApp", Copy) {
    dependsOn(":webBuild")

    from("../dist")
    into("src/main/assets")
}

tasks.register("webBuild", Exec) {
    workingDir("../")

    commandLine(
        "npm",
        "run",
        "build"
    )
}

preBuild.dependsOn("copyWebApp")
